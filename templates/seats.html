{% extends "base.html" %}
{% block content %}
  <div class="toolbar">
    <div class="toolbar-info">
      <div class="who">{{ user.email }}</div>
      <div class="tickets">
        Seats selected: <strong id="count">0</strong> of {{ user.tickets }}
      </div>
    </div>
    <p id="message" role="status"></p>
    <button id="confirm" class="btn">Confirm seats</button>
  </div>

  <div class="legend">
    <span><i class="swatch available"></i> Available</span>
    <span><i class="swatch selected"></i> Your selection</span>
    <span><i class="swatch taken"></i> Taken</span>
  </div>

  <div class="floor-wrap">
    <div id="floor"></div>
  </div>

  <script>
    const TABLES = {{ tables | tojson }};
    const FEATURES = {{ features | tojson }};
    const FLOOR_W = {{ floor_w }};
    const FLOOR_H = {{ floor_h }};
    const ALLOWED = {{ user.tickets }};
    const SAVED = {{ user.seats | tojson }};
    const TAKEN = {{ taken | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/seats.js') }}"></script>
{% endblock %}
