{% extends "base.html" %}
{% block content %}
  <h1>Choose your seats</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" class="login">
    <label>
      Email address
      <input type="email" name="email" required autofocus>
    </label>
    <button type="submit">Continue</button>
  </form>
{% endblock %}
